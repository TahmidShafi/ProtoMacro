name: Food Data Pipeline

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'pipeline/**'
      - 'js/data/**'
  workflow_dispatch:

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: pytest pipeline/tests -v
